name: Jekyll site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    # Run on macOS so the workflow uses the macOS toolchain (Xcode is available here for iOS work)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.x'
        bundler-cache: true

    - name: Install dependencies
      run: |
        if [ -f Gemfile ]; then
          bundle install
        else
          gem install jekyll bundler
        fi

    - name: Build the site
      run: |
        mkdir -p _site
        bundle exec jekyll build --future --destination _site

    - name: Upload site artifact
      uses: actions/upload-artifact@v4
      with:
        name: site
        path: _site
