name: Jekyll site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.x'
        bundler-cache: true

    - name: why is github whining bro
      run: |
        set -euxo pipefail
        echo "Runner: $(uname -a)"
        ruby --version || true
        gem --version || true
        bundler --version || gem install bundler --no-document && bundler --version || true
        which jekyll || true
        bundle env || true

    - name: Install dependencies (robust)
      run: |
        set -euxo pipefail
        if [ -f Gemfile ]; then
          # parallel installs and automatic retries are more robust than --verbose
          bundle install --jobs=4 --retry=3
        else
          gem install jekyll bundler --no-document
        fi

    - name: Build the site
      run: |
        set -euxo pipefail
        mkdir -p _site
        bundle exec jekyll build --future --destination _site

    - name: Upload site artifact
      uses: actions/upload-artifact@v4
      with:
        name: site
        path: _site
